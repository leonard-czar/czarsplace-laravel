# CI: runs PHPUnit on every push / PR to main.
#
# CD: SSH deploy only on push to main (not on PRs). Repo secrets:
#   SERVER_HOST       — VPS host/IP (DNS-only / grey cloud in Cloudflare if that hostname is otherwise proxied).
#   SERVER_PORT       — SSH port (e.g. 22).
#   SERVER_USERNAME   — SSH user (must own the app dir, or use SERVER_SUDO_PASSWORD).
#   SERVER_PRIVATE_KEY — PEM OpenSSH private key (full key including BEGIN/END lines).
#   SERVER_SUDO_PASSWORD — optional: sudo password for SERVER_USERNAME so deploy can
#                       `chown -R user:user` the app tree when root/www-data owns files
#                       (fixes "unable to unlink ... Permission denied"). Prefer one-time
#                       `chown` as root on the VPS or passwordless sudo for chown only.
#   After deploy, storage/ + bootstrap/cache/ are set to user:www-data (when sudo secret
#   is set) so php-fpm can append laravel.log. Without sudo, fix once on the VPS, e.g.:
#   sudo chown -R lebechi:www-data storage bootstrap/cache && sudo chmod -R ug+rwx storage bootstrap/cache

name: CI / CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, bcmath, fileinfo, intl
          coverage: none
          tools: composer:v2

      - name: Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Environment for CI
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: PHPUnit
        run: php artisan test

  deploy:
    name: Deploy (production)
    needs: tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        env:
          SERVER_SUDO_PASSWORD: ${{ secrets.SERVER_SUDO_PASSWORD }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          envs: SERVER_SUDO_PASSWORD
          timeout: 60s
          command_timeout: 20m
          script: |
            set -e
            cd /home/lebechi/www/czarsplace.cybercraftsmen.tech/czarsplace-laravel
            # Root/www-data-owned files block git checkout ("unable to unlink ..."). Optional: set repo secret
            # SERVER_SUDO_PASSWORD to this user's sudo password so we can chown the tree before git. Otherwise
            # fix once as root: chown -R lebechi:lebechi /home/lebechi/www/.../czarsplace-laravel
            if [ -n "${SERVER_SUDO_PASSWORD:-}" ]; then
              printf '%s\n' "$SERVER_SUDO_PASSWORD" | sudo -S -p '' chown -R "$(whoami):$(whoami)" .
            fi
            # Match GitHub main exactly. Plain checkout/pull fails if the VPS has local edits to tracked files.
            # -f -B recreates/resets local main to origin/main and overwrites the working tree; .env stays if gitignored.
            git fetch origin
            git checkout -f -B main origin/main
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
            chmod -R ug+rwx storage bootstrap/cache
            if [ -n "${SERVER_SUDO_PASSWORD:-}" ]; then
              for g in www-data nginx; do
                if getent group "$g" >/dev/null 2>&1; then
                  printf '%s\n' "$SERVER_SUDO_PASSWORD" | sudo -S -p '' chown -R "$(whoami):$g" storage bootstrap/cache
                  chmod -R ug+rwx storage bootstrap/cache
                  break
                fi
              done
            fi
