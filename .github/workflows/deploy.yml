# CI: runs PHPUnit on every push / PR to main.
#
# CD: SSH deploy only on push to main (not on PRs). Repo secrets:
#   HOST              — MUST be reachable on port 22 from the public internet.
#                       Use your VPS public IP, or a hostname whose DNS is "DNS only"
#                       (grey cloud) in Cloudflare. If HOST is the same domain you
#                       put behind Cloudflare "Proxied" (orange cloud), SSH often
#                       resolves to a Cloudflare IP and you get: dial tcp …:22 i/o timeout.
#   SERVER_USERNAME   — SSH user
#   SERVER_PRIVATE_KEY — PEM OpenSSH private key (full key including BEGIN/END lines)
#
# If SSH is not on port 22, add under `with:`:  port: 2222  (or your port).

name: CI / CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, bcmath, fileinfo, intl
          coverage: none
          tools: composer:v2

      - name: Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Environment for CI
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: PHPUnit
        run: php artisan test

  deploy:
    name: Deploy (production)
    needs: tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 20m
          script: |
            set -e
            cd /home/lebechi/www/czarsplace.cybercraftsmen.tech/czarsplace-laravel
            # If git fails with "unable to unlink ... Permission denied", some files are owned by root/www-data
            # (often from running composer/artisan as root). Fix once on the VPS as root, e.g.:
            #   chown -R lebechi:lebechi /home/lebechi/www/czarsplace.cybercraftsmen.tech/czarsplace-laravel
            # Then run deploy only as that SSH user (no sudo in this job — passwordless sudo is not assumed).
            # Match GitHub main exactly. Plain checkout/pull fails if the VPS has local edits to tracked files.
            # -f -B recreates/resets local main to origin/main and overwrites the working tree; .env stays if gitignored.
            git fetch origin
            git checkout -f -B main origin/main
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
